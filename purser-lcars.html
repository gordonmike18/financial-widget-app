<title>Purser LCARS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* ═══ SKIN: LCARS (TNG) ══════════════════════════════════════════════════
   Layout: TNG double-elbow console. A header frame and a main frame share one
   left rail; modules float in open black space under bracket headers.
   Every color, size and font below is a token. A future skin overrides the
   tokens (see SKINS in the UI script) and, if it wants, its own frame renderer. */
:root{
  --bg:#000; --well:#0e0a08; --rule:#2a2320;
  --ink:#f6e4cc; --ink-2:#c7b29a; --ink-3:#85766a;
  --gold:#ff9c00; --peach:#ffcc99; --tangerine:#ff9966; --lavender:#cc99cc; --violet:#9977aa;
  --lilac:#9999cc; --sky:#99ccff; --bluebell:#8899ff; --rose:#cc6666; --alert:#ff5a3c; --butter:#ffe0a3; --off:#352d29;
  --spend:var(--tangerine); --earn:var(--sky); --save:var(--lavender); --net:var(--gold); --neg:var(--rose);
  --space-1:#16102a; --space-2:#07060b;
  --f-disp:'Antonio','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --rail:clamp(78px,10vw,164px); --bar:clamp(12px,1.2vw,18px); --gap:5px;
  --ro:clamp(44px,5vw,84px); --ri:clamp(20px,2vw,32px);
  --ease:cubic-bezier(.76,0,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── Simulated desktop ── */
#desk{position:fixed;inset:0;background:radial-gradient(120% 90% at 75% 8%,var(--space-1) 0%,var(--space-2) 58%,var(--bg) 100%);overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.menubar{position:absolute;top:0;left:0;right:0;height:calc(28px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:20px;background:rgba(18,14,24,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:500 13px/1 -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#e9e3db;border-bottom:1px solid rgba(255,255,255,.06);z-index:1}
.menubar b{font-weight:700}.menubar .dim{color:#a69c92}.menubar .sp{flex:1}
@media (max-width:560px){.menubar .opt{display:none}}
.desk-note{position:absolute;left:24px;right:24px;bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:470px;font:500 13px/1.5 var(--f-body);color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.desk-note strong{color:var(--ink-2);font-weight:600}

/* ── Compact widget (a full C-frame) ── */
.widget{position:absolute;top:58px;right:40px;width:min(360px,calc(100vw - 32px));padding:9px;background:var(--bg);border-radius:30px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 0 0 1px rgba(255,156,0,.18),0 24px 60px rgba(0,0,0,.75),0 0 90px rgba(255,156,0,.07);z-index:2}
.widget.gone{visibility:hidden}
.widget.dragging{cursor:grabbing;box-shadow:0 0 0 1px rgba(255,156,0,.4),0 30px 70px rgba(0,0,0,.8)}
.widget.arrive{animation:arrive .8s ease-out}
@keyframes arrive{0%{box-shadow:0 0 0 2px var(--gold),0 0 70px rgba(255,156,0,.7)}100%{box-shadow:0 0 0 1px rgba(255,156,0,.18),0 24px 60px rgba(0,0,0,.75),0 0 90px rgba(255,156,0,.07)}}
.w{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:18px auto 18px}
.w-rail{grid-column:1;grid-row:1/4;display:flex;flex-direction:column;gap:4px}
.w-rail>div{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 4px;font:500 10px/1 var(--f-disp);letter-spacing:.06em;color:#000}
.w-el-t{background:var(--gold);border-top-left-radius:26px;height:50px}
.w-mid{flex:1;background:var(--lavender)}
.w-mid2{height:26px;background:var(--peach)}
.w-el-b{background:var(--lilac);border-bottom-left-radius:26px;height:50px}
.w-fill{grid-column:2;grid-row:2;background:linear-gradient(var(--gold) 50%,var(--lilac) 50%)}
.w-body{grid-column:2;grid-row:2;background:var(--bg);border-radius:16px 0 0 16px;padding:10px 2px 12px 14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.w-tb,.w-bb{grid-column:2;display:flex;gap:4px;align-items:stretch}
.w-tb{grid-row:1}.w-bb{grid-row:3}
.w-tb .s,.w-bb .s{background:var(--c);flex:1}
.w-tb .cap,.w-bb .cap{flex:0 0 22px;border-radius:0 9px 9px 0}
.w-t{font:600 15px/18px var(--f-disp);letter-spacing:.16em;color:var(--gold);padding:0 4px}
.w-exp{display:flex;align-items:center;padding:0 10px;background:var(--gold);color:#000;font:600 12px/1 var(--f-disp);letter-spacing:.14em;border-radius:0 9px 9px 0;transition:background .2s}
.widget:hover .w-exp,.widget:focus-visible .w-exp{background:var(--butter)}
.w-r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.w-lbl{font:500 12px/1 var(--f-disp);letter-spacing:.14em;color:var(--ink-2)}
.w-demo{font:500 10px/1 var(--f-disp);letter-spacing:.12em;color:var(--alert);border:1px solid var(--alert);border-radius:8px;padding:3px 6px 2px}
.w-net{font:500 50px/.9 var(--f-disp);color:var(--net);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.w-net.neg{color:var(--neg)}
.w-net .c{font-size:.42em;vertical-align:.95em;opacity:.8}
.w-formula{font:400 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--ink-3);margin-top:-4px}
.w-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.w-trio div{display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--c);padding-top:4px}
.w-trio span{font:500 10px/1 var(--f-disp);letter-spacing:.14em;color:var(--c)}
.w-trio b{font:500 18px/1 var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.w-free{display:flex;flex-direction:column;gap:4px}
.w-free .row{display:flex;justify-content:space-between;align-items:baseline;font:500 11px/1 var(--f-disp);letter-spacing:.14em;color:var(--sky)}
.w-free .row b{font:500 20px/1 var(--f-disp);color:var(--sky);letter-spacing:0}
.w-meter{display:flex;gap:2px;height:7px}
.w-meter i{flex:1;background:var(--off)}
.w-meter i.on{background:var(--sky)}.w-meter i.rs{background:var(--peach)}
.w-next{font:500 12px/1.2 var(--f-disp);letter-spacing:.08em;color:var(--peach)}
.widget.launch .w-body>*{opacity:0;transition:opacity .14s}
.widget.launch .w-exp{background:#fff}

/* ── Console shell ── */
.console{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--gap)*2);padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px)) 10px;overflow:hidden}
.console.boot::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--butter) 50%,var(--gold) 70%,transparent);box-shadow:0 0 18px var(--gold);animation:scan 1.05s .55s ease-in-out both}
@keyframes scan{0%{transform:translateY(0);opacity:1}90%{opacity:.9}100%{transform:translateY(100vh);opacity:0}}
.ghost{position:fixed;z-index:20;pointer-events:none;border:2px solid var(--gold);border-radius:26px;box-shadow:0 0 26px rgba(255,156,0,.55),inset 0 0 26px rgba(255,156,0,.25)}

.blk{background:var(--c);color:#000;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 6px;font:500 clamp(10px,.9vw,13px)/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;text-align:right;min-height:24px;border:0}
.seg{background:var(--c);flex:1 1 0;min-width:6px}
.seg.cap{flex:0 0 calc(var(--bar)*1.7);border-radius:0 999px 999px 0}
.seg-t{flex:0 0 auto;font:500 calc(var(--bar)*.92)/var(--bar) var(--f-disp);color:var(--c);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:0 3px}
@container (max-width:0px){.x{}}

/* Header frame: elbow at bottom-left */
.hf{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:auto var(--bar)}
.hf-rail{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;gap:var(--gap);position:relative;z-index:1}
.hf-rail .blk{flex:0 0 auto;height:clamp(30px,3.6vw,46px)}
.hf-rail .elbow{flex:1 1 auto;min-height:calc(var(--bar) + var(--ri) + 26px);border-bottom-left-radius:var(--ro);padding-bottom:calc(var(--bar) + 6px)}
.hf-fill{grid-column:2;grid-row:1;background:var(--c)}
.hf-body{grid-column:2;grid-row:1;background:var(--bg);border-bottom-left-radius:var(--ri);padding:4px 0 14px clamp(14px,1.8vw,26px);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;min-width:0}
.hf-bar{grid-column:2;grid-row:2;display:flex;gap:var(--gap);min-width:0;overflow:hidden}

/* Main frame: elbow at top-left */
.mf{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--bar) minmax(0,1fr);min-height:0}
.mf-rail{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;gap:var(--gap);position:relative;z-index:2;min-height:0}
.mf-rail .elbow{flex:0 0 auto;height:calc(var(--bar) + var(--ri) + clamp(24px,3.4vw,50px));border-top-left-radius:var(--ro)}
.mf-rail .fill{flex:1 1 auto;min-height:12px}
.mf-fill{grid-column:2;grid-row:2;background:var(--c)}
.mf-body{grid-column:2;grid-row:2;background:var(--bg);border-top-left-radius:var(--ri);overflow:auto;min-height:0;min-width:0;padding:clamp(16px,1.8vw,26px) clamp(12px,1.4vw,22px) 48px clamp(20px,2.2vw,34px);container-type:inline-size;scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.mf-bar{grid-column:2;grid-row:1;display:flex;gap:var(--gap);min-width:0;overflow:hidden}
.navbtn{position:relative;cursor:pointer;flex:0 0 auto;height:clamp(40px,6.4vh,64px);font:500 clamp(12px,1.05vw,16px)/1 var(--f-disp);transition:filter .15s}
.navbtn:hover{filter:brightness(1.15)}
.navbtn .code{position:absolute;left:8px;top:6px;font-size:.66em;opacity:.65}
.navbtn.on{--c:var(--butter)!important}
.navbtn.on::after{content:'';position:absolute;right:-13px;top:24%;bottom:24%;width:8px;background:var(--c);border-radius:0 4px 4px 0}
.navbtn kbd{font:inherit;font-size:.66em;opacity:.6;position:absolute;left:8px;bottom:6px}

/* Header contents */
.hdr-ctl{display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:6px}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ctl-lbl{font:500 12px/1 var(--f-disp);letter-spacing:.16em;color:var(--ink-3)}
.stepper{display:inline-flex;align-items:stretch;gap:var(--gap)}
.stepper .lb{min-width:38px;padding:0 12px 7px}
.step-lbl{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(150px,14vw,214px);height:34px;padding:0 12px;font:500 17px/1 var(--f-disp);letter-spacing:.1em;color:var(--peach);box-shadow:inset 0 2px 0 var(--violet),inset 0 -2px 0 var(--violet)}
.hdr-id{display:flex;flex-direction:column;align-items:flex-end;gap:7px;margin-left:auto;text-align:right}
.title{font:600 clamp(40px,5.2vw,82px)/.84 var(--f-disp);letter-spacing:.05em;color:var(--gold);margin:0}
.subtitle{font:400 clamp(11px,.95vw,14px)/1.2 var(--f-disp);letter-spacing:.24em;color:var(--peach)}
.sd{font:400 12px/1 var(--f-disp);letter-spacing:.16em;color:var(--ink-3)}

/* Buttons */
.lb{--c:var(--lilac);appearance:none;border:0;background:var(--c);color:#000;cursor:pointer;font:500 clamp(13px,1vw,15px)/1 var(--f-disp);letter-spacing:.07em;text-transform:uppercase;height:34px;min-width:80px;padding:0 14px 7px;display:inline-flex;align-items:flex-end;justify-content:flex-end;text-align:right;transition:filter .15s,background-color .15s;white-space:nowrap}
.lb:hover{filter:brightness(1.18)}
.lb:active{filter:brightness(1.6)}
.lb.round{border-radius:999px}.lb.rl{border-radius:999px 0 0 999px}.lb.rr{border-radius:0 999px 999px 0}
.lb.on{--c:var(--butter)}
.lb.sm{height:28px;min-width:0;font-size:13px;padding:0 12px 6px}
.lb.wide{min-width:150px}
.lb[disabled]{--c:var(--off);color:var(--ink-3);cursor:not-allowed;filter:none}
.lb.collapse{--c:var(--rose);height:40px;min-width:min(240px,100%);font-size:17px;letter-spacing:.12em}
.lb.hatch{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 5px,transparent 5px 10px)}
.grp{display:inline-flex;gap:var(--gap);flex-wrap:wrap}
.chip{--c:var(--ink-3);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font:500 12px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c);white-space:nowrap}
.chip.solid{background:var(--c);color:#000;box-shadow:none}
.chip.demo{--c:var(--alert)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Module header (bracket) */
.mh{--c:var(--lilac);display:flex;align-items:center;gap:8px;margin-bottom:14px;min-width:0}
.mh-cap{flex:0 0 16px;height:22px;background:var(--c);border-radius:11px 0 0 11px}
.mh-t{font:500 clamp(15px,1.2vw,19px)/1 var(--f-disp);letter-spacing:.1em;color:var(--c);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.mh-line{flex:1 1 20px;height:6px;background:var(--c);min-width:12px}
.mh-code{flex:0 0 auto;font:500 12px/1 var(--f-disp);color:#000;background:var(--c);padding:5px 10px 4px 8px;border-radius:0 11px 11px 0;letter-spacing:.08em;white-space:nowrap}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:34px 30px}
.grid>*{min-width:0}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.stack{display:flex;flex-direction:column;gap:34px;min-width:0}
@container (max-width:1180px){.s8,.s7,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}.s6{grid-column:span 12}}
@container (max-width:640px){.grid>*{grid-column:span 12!important}}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 20px}
@container (max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:420px){.metrics{grid-template-columns:minmax(0,1fr)}}
.metric{--c:var(--spend);display:flex;flex-direction:column;gap:8px;min-width:0}
.metric-tab{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;background:var(--c);color:#000;height:30px;padding:0 12px 5px 18px;border-radius:15px 0 0 15px;font:600 18px/1 var(--f-disp);letter-spacing:.16em}
.metric-tab small{font-weight:400;font-size:11px;letter-spacing:.1em}
.metric-val{font:500 clamp(36px,4.2vw,70px)/.95 var(--f-disp);color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.005em;white-space:nowrap}
.metric-val .c{font-size:.42em;vertical-align:.95em;margin-left:1px;opacity:.75}
.metric-sub{font:500 14px/1.35 var(--f-body);color:var(--ink-2);letter-spacing:.03em;min-height:2.7em}
.metric.neg{--c:var(--neg)}
.pend{display:inline-block;padding:0 6px;margin:1px 0;border-radius:3px;color:var(--c,var(--gold));box-shadow:inset 0 0 0 1.5px var(--c,var(--gold));background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c,var(--gold)) 22%,transparent) 0 4px,transparent 4px 8px);font:500 13px/1.5 var(--f-disp);letter-spacing:.06em;white-space:nowrap}
.netnote{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;padding:10px 14px;border-left:6px solid var(--gold);background:var(--well);font-size:15px;color:var(--ink-2)}
.netnote b{color:var(--ink);font-weight:600}

/* Allocation */
.eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-bottom:22px}
.eq-b{--c:var(--sky);display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:8px 14px 8px 12px;border-left:8px solid var(--c);min-width:0}
.eq-b span{font:500 12px/1 var(--f-disp);letter-spacing:.14em;color:var(--c)}
.eq-b b{font:500 clamp(24px,2.3vw,36px)/1 var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.eq-b.big{background:var(--c);border-radius:0 999px 999px 0;padding-right:30px}
.eq-b.big span,.eq-b.big b{color:#000}
.eq-op{align-self:center;font:400 34px/1 var(--f-disp);color:var(--ink-3);padding:0 2px}
.abr{position:relative;height:22px;margin-bottom:6px;border-top:2px solid var(--sky);border-left:2px solid var(--sky);border-right:2px solid var(--sky);border-radius:8px 8px 0 0}
.abr span{position:absolute;left:10px;top:-11px;background:var(--bg);padding:0 8px;font:500 12px/20px var(--f-disp);letter-spacing:.14em;color:var(--sky);white-space:nowrap}
.abar{display:flex;gap:4px;height:46px}
.abar button{--c:var(--sky);border:0;cursor:pointer;background:var(--c);min-width:8px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 6px;color:#000;font:500 13px/1 var(--f-disp);letter-spacing:.08em;overflow:hidden;white-space:nowrap;transition:filter .15s}
.abar button:hover{filter:brightness(1.18)}
.abar button:first-child{border-radius:23px 0 0 23px}
.abar button:last-child{border-radius:0 23px 23px 0}
.abar .hatched{background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 30%,transparent) 6px 12px)}
.alegend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px;margin-top:16px}
@container (max-width:760px){.alegend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alg{--c:var(--sky);display:flex;flex-direction:column;gap:3px;padding-left:10px;border-left:4px solid var(--c);min-width:0}
.alg .k{font:500 12px/1 var(--f-disp);letter-spacing:.14em;color:var(--c)}
.alg .v{font:500 22px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.alg .n{font-size:13.5px;line-height:1.3;color:var(--ink-3)}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:9px 12px;border-left:6px solid var(--alert);background:var(--well);color:var(--ink);font-size:15px}

/* Credit */
.bigstat{--c:var(--sky);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bigstat b{font:500 clamp(44px,4.4vw,66px)/.9 var(--f-disp);color:var(--c);font-variant-numeric:tabular-nums}
.bigstat span{font:500 13px/1.2 var(--f-disp);letter-spacing:.14em;color:var(--ink-2)}
.cu{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.cu-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 14px/1 var(--f-disp);letter-spacing:.08em}
.cu-h .r{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cu-f{font-size:13.5px;color:var(--ink-3)}
.segm{position:relative;display:flex;gap:3px;height:16px;padding-top:0}
.segm i{flex:1;background:var(--off)}
.segm i.on{background:var(--c)}
.segm .mk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink-2)}
.segm.hasmk{margin-top:14px}
.segm .mk span{position:absolute;top:-14px;left:3px;font:500 10px/1 var(--f-disp);color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
.note{font-size:14.5px;line-height:1.4;color:var(--ink-2);padding:8px 12px;border-left:4px solid var(--c,var(--violet));background:var(--well)}
.note b{color:var(--ink)}

/* Charts */
.chart{width:100%;overflow-x:auto;overflow-y:hidden}

<script id="core">
"use strict";
/* ═══ CORE ══════════════════════════════════════════════════════════════
   Pure data model and accounting. No DOM, no styling.
   Phase 2 replaces MockProvider with a BackendProvider that reads the local
   SQLite + Plaid service on the Mac mini. Everything below the provider
   (Ledger, Calc) stays the same.                                           */

const U = {
  iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); },
  addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; },
  days(a, b){ return Math.round((U.parse(b) - U.parse(a)) / 86400000); },
  r2(n){ return Math.round(n*100)/100; },
  sum(arr, f){ let s = 0; for (const x of arr) s += f ? f(x) : x; return s; },
  rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
};

/* ── LEDGER ────────────────────────────────────────────────────────────
   One list of records. Projects are tags on these records, never copies.
   Record kinds and how they count:
     income     → EARN   (paychecks, interest, bonuses, cashback, resale payouts)
     expense    → SPEND
     refund     → reduces SPEND, links refundOf (rule 7)
     saving     → SAVE   verified reduction vs. a documented baseline; no cash moves (rule 6)
     transfer   → neither. Account to account: card payments, loan principal,
                  investing, ATM withdrawals, cash deposits (rules 1–4, 9)
     adjustment → neither. Cash count reconciliation
     review     → neither. Synced bank item awaiting confirmation
   Every record carries source + recordedAt (rule 10).                       */
const Ledger = {
  effect(t, id){
    if (t.kind === 'saving') return 0;
    if (t.kind === 'transfer') return (t.counterAccountId === id ? t.amount : 0) - (t.accountId === id ? t.amount : 0);
    if (t.accountId !== id) return 0;
    switch (t.kind){
      case 'income': case 'refund': return t.amount;
      case 'expense': return -t.amount;
      case 'adjustment': case 'review': return t.dir * t.amount;
    }
    return 0;
  },
  balance(data, id, asOf){
    const a = data.byId[id]; let b = a.opening || 0;
    for (const t of data.tx){ if (t.status !== 'posted') continue; if (asOf && t.date > asOf) continue; b += Ledger.effect(t, id); }
    return U.r2(b);
  },
};

/* ── DATA PROVIDER (demo) ──────────────────────────────────────────────
   Interface every provider implements:
     load(today) → { today, trackingStart, accounts, tx, bills, projects,
                     resale, sessions, timeLog, ideas, assets }
   BackendProvider (Phase 2) will GET http://127.0.0.1:<port>/api/snapshot.
   Plaid access tokens and secrets never leave that backend.                */
const MockProvider = { id:'demo', label:'Demo provider', load(now){ return buildDemo(now || new Date()); } };

function buildDemo(now){
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const TODAY = U.iso(today);
  const rnd = U.rng(1701), r = (a,b) => a + (b-a)*rnd();
  const N = 22;                                            // months of history
  const md = (i, day) => { const b = new Date(today.getFullYear(), today.getMonth()-(N-1-i), 1); const last = new Date(b.getFullYear(), b.getMonth()+1, 0).getDate(); return new Date(b.getFullYear(), b.getMonth(), Math.min(day, last)); };
  const ago = n => U.iso(U.addDays(today, -n));
  const trackingStart = U.iso(md(0, 1));
  const tx = []; let seq = 0;
  const add = o => {
    const date = typeof o.date === 'string' ? o.date : U.iso(o.date);
    if (date > TODAY) return null;
    const t = Object.assign({ status:'posted', source:'demo', projects:[], ai:null, category:'', sub:'', accountId:null, counterAccountId:null }, o);
    t.id = 'd' + String(++seq).padStart(4, '0'); t.date = date; t.amount = U.r2(o.amount); t.recordedAt = date + 'T08:00:00Z';
    tx.push(t); return t;

  for (let i=0; i<N; i++){

    if (age === 2){

      xfer(D(3), 'checking', 'halyard', 25, 'OPENING DEPOSIT — HALYARD CU', 'internal');
    } else add({ date:D(15), desc:'PAYROLL DIRECT DEP — KESTREL LOGISTICS', kind:'income', sub:'paycheck', category:'Salary', amount:pay, accountId:'checking' });
    add({ date:D(28), desc:'INTEREST PAID', kind:'income', sub:'interest', category:'Interest', amount:(4000+400*i)*0.04/12, accountId:'savings' });
    const fl = {15:420, 11:575, 6:360, 2:610}[age];
    if (fl) add({ date:D(18), desc:'CLIENT PAYMENT — WEB MAINTENANCE', kind:'income', sub:'freelance', category:'Freelance', amount:fl, accountId:'checking' });

    // Fixed bills
    add({ date:D(1), desc:'ALDERWOOD PROPERTIES — RENT', kind:'expense', category:'Housing', amount:1650, accountId:'checking' });

  // Resale: payout (gross − platform fees) is Earn, shipping is Spend.

  const halyardBonus = add({ date:ago(2), desc:'HALYARD CU — NEW MEMBER BONUS', kind:'income', sub:'bonus', category:'Bonuses', amount:200, accountId:'halyard', projects:['bonuses','aicraft'], ai:'discovered', status:'pending', ideaId:'idea-halyard' });

  // A refund adjusts the period it posts in (rule 7)

  add({ date:ago(0), desc:'GREENLEAF MARKET', kind:'expense', category:'Groceries', amount:63.40, accountId:'corvus', status:'pending' });

  // Cashback, then card payments. Each card is paid in full on the 25th/27th for last month (rule 2).
  const mk = i => U.iso(md(i,1)).slice(0,7);
  const cardNet = (card, k) => U.sum(tx.filter(t => t.status === 'posted' && t.accountId === card && t.date.slice(0,7) === k), t => t.kind === 'expense' ? t.amount : (t.kind === 'refund' || t.kind === 'income') ? -t.amount : 0);

  add({ date:ago(2), desc:'ATM WITHDRAWAL #4471 HARBOR ST', kind:'review', dir:-1, amount:120, accountId:'checking', category:'Needs review', match:{ suggest:'atm', confidence:'HIGH', why:'ATM terminal ID in description. Round amount.' } });
  add({ date:ago(3), desc:'DEPOSIT BR 0119 TELLER', kind:'review', dir:1, amount:200, accountId:'checking', category:'Needs review', match:{ suggest:'deposit', confidence:'MEDIUM', why:'Teller deposit with no check image attached. Could be cash or a paper check.' } });

  tx.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1);

  const matures = U.iso(new Date(today.getFullYear(), today.getMonth()+5, 15));
  const accounts = [
    { id:'checking', name:'Everyday Checking', inst:'Keel Federal CU', mask:'4417', type:'checking', group:'cash', ledger:true, c:'sky', target:3842.17, plaid:'Balance, Transactions' },

    { id:'corvus', name:'Rewards Visa', inst:'Corvus Card', mask:'1092', type:'credit', group:'credit', ledger:true, c:'tangerine', opening:0, limit:12000, apr:22.99, plaid:'Liabilities, Transactions' },

    { id:'loan', name:'Auto Loan', inst:'Keel Federal CU', mask:'5521', type:'loan', group:'loan', ledger:true, c:'rose', opening:-loanOpening, original:LOAN.original, apr:5.9, payment:LOAN.payment, plaid:'Liabilities' },
  ];
  // Holdings: last row takes the remainder so holdings always sum to the account value
  for (const a of accounts) if (a.holdings){ const rest = a.value - U.sum(a.holdings.slice(0,-1), h => h[2]); a.holdings[a.holdings.length-1][2] = U.r2(rest); }
  const data = { provider:'demo', today:TODAY, trackingStart, accounts, tx, sessions, resale };
  data.byId = Object.fromEntries(accounts.map(a => [a.id, a]));
  // Solve opening balances so the ledger lands on the snapshot balances
  for (const a of accounts) if (a.target != null){ a.opening = 0; a.opening = U.r2(a.target - Ledger.balance(data, a.id)); }
  // Investment value history: walk back from today's value, removing contributions
  for (const a of accounts) if (a.group === 'invest'){
    const h = [a.value]; let v = a.value;
    for (let k=1; k<12; k++){ const contrib = a.id === 'brokerage' ? 500 : a.id === 'roth' ? 300 : (k % 3 === 0 ? 100 : 0); v = (v - contrib) / (1 + r(-0.035, 0.05)); h.unshift(U.r2(v)); }

  data.timeLog = [

  ];
  data.ideas = buildIdeas(today, ago, halyardBonus);
  return data;
}

  return [

/* ── CALCULATIONS ───────────────────────────────────────────────────── */
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const MON = MONTHS.map(m => m.slice(0,3));
const Calc = {
  range(ui, data){
    const T = data.today, t = U.parse(T), start0 = data.trackingStart;
    if (ui.period === 'month'){
      const s = new Date(t.getFullYear(), t.getMonth()+(ui.monthOffset||0), 1), e = new Date(s.getFullYear(), s.getMonth()+1, 0);
      const end = U.iso(e) > T ? T : U.iso(e);
      return { kind:'month', start:U.iso(s), end, label:MONTHS[s.getMonth()]+' '+s.getFullYear(), short:MON[s.getMonth()]+(end === T ? ' MTD' : ''), partial:end === T, canPrev:U.iso(s) > start0, canNext:(ui.monthOffset||0) < 0 };
    }
    if (ui.period === 'year'){
      const y = t.getFullYear()+(ui.yearOffset||0); let start = y+'-01-01'; if (start < start0) start = start0;
      const end = y+'-12-31' > T ? T : y+'-12-31';
      return { kind:'year', start, end, label:String(y)+(end === T ? ' · YEAR TO DATE' : ''), short:y+(end === T ? ' YTD' : ''), partial:end === T, canPrev:y > U.parse(start0).getFullYear(), canNext:(ui.yearOffset||0) < 0 };
    }
    const s = U.parse(start0);
    return { kind:'lifetime', start:start0, end:T, label:'SINCE '+MONTHS[s.getMonth()]+' '+s.getFullYear(), short:'LIFETIME', partial:true, canPrev:false, canNext:false };
  },
  // Spend / Earn / Save / Net. Transfers, adjustments and review items never count.
  metrics(data, rg, opt){
    opt = opt || {};
    let spend = 0, earn = 0, save = 0; const pend = { spend:0, earn:0 }; let n = 0;
    for (const t of data.tx){
      if (t.date < rg.start || t.date > rg.end) continue;
      if (opt.project && !t.projects.includes(opt.project)) continue;
      let e = 0, s = 0, v = 0;
      if (t.kind === 'income') e = t.amount; else if (t.kind === 'expense') s = t.amount; else if (t.kind === 'refund') s = -t.amount; else if (t.kind === 'saving') v = t.amount; else continue;
      if (t.status === 'pending'){ pend.earn += e; pend.spend += s; if (!opt.includePending) continue; }
      earn += e; spend += s; save += v; n++;
    }
    spend = U.r2(spend); earn = U.r2(earn); save = U.r2(save);
    return { spend, earn, save, net:U.r2(earn + save - spend), cashflow:U.r2(earn - spend), pend:{ spend:U.r2(pend.spend), earn:U.r2(pend.earn) }, pendIncluded:!!opt.includePending, n };
  },
  series(data, endOff, n, opt){
    const out = [];
    for (let k = endOff-n+1; k <= endOff; k++){
      const rg = Calc.range({ period:'month', monthOffset:k }, data);
      if (rg.end < data.trackingStart){ out.push(null); continue; }
      const m = Calc.metrics(data, rg, { includePending:!!opt.includePending && k === 0, project:opt.project });
      out.push(Object.assign(m, { off:k, rg, mon:MON[U.parse(rg.start).getMonth()], yr:rg.start.slice(2,4) }));
    }
    return out;
  },
  balances(data){ const b = {}; for (const a of data.accounts) b[a.id] = a.ledger ? Ledger.balance(data, a.id) : a.value; return b; },
  history(data, a){
    if (!a.ledger) return a.history.map((v,i) => ({ v, off:i-11 }));
    const t = U.parse(data.today), out = [];
    for (let k=-11; k<=0; k++){
      const e = new Date(t.getFullYear(), t.getMonth()+k+1, 0); const asOf = k === 0 ? data.today : U.iso(e);
      out.push({ off:k, v: asOf < data.trackingStart ? null : Ledger.balance(data, a.id, asOf) });
    }
    return out;
  },
  cardNet(data, card, monthKey){
    return U.r2(U.sum(data.tx.filter(t => t.status === 'posted' && t.accountId === card && t.date.slice(0,7) === monthKey), t => t.kind === 'expense' ? t.amount : (t.kind === 'refund' || t.kind === 'income') ? -t.amount : 0));
  },
  obligations(data, days){
    const T = data.today, tD = U.parse(T), end = U.iso(U.addDays(tD, days)), out = [];
    for (const b of data.bills){
      for (let m=0; m<3; m++){
        const base = new Date(tD.getFullYear(), tD.getMonth()+m, 1), last = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
        const due = U.iso(new Date(base.getFullYear(), base.getMonth(), Math.min(b.day, last)));
        if (due <= T || due > end) continue;
        let amount = b.amount, est = false, note = b.note || '';
        if (b.card){
          const k = U.iso(new Date(base.getFullYear(), base.getMonth()-1, 1)).slice(0,7);
          amount = Calc.cardNet(data, b.card, k); est = k === T.slice(0,7);
          note = est ? 'Statement still open. Amount so far.' : 'Closed statement balance.';
          if (amount <= 0.005) continue;
        }
        if (b.estimate){ const past = data.tx.filter(t => t.desc.startsWith(b.estimate) && t.status === 'posted').slice(-3); amount = U.sum(past, t => t.amount) / Math.max(1, past.length); est = true; note = 'Average of last 3 bills.'; }
        const card = data.byId[b.from] && data.byId[b.from].type === 'credit';
        out.push({ id:b.id+'-'+due, name:b.name, due, days:U.days(T, due), amount:U.r2(amount), from:b.from, reserve:!card, kind:b.kind, est, note:card ? 'Charged to card. Covered when that statement is paid, so not reserved twice.' : note });
      }
    }
    return out.sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : b.amount - a.amount);
  },
  allocation(data, bal, days){
    let available = 0, restricted = 0; const avail = [], restr = [];
    for (const a of data.accounts.filter(a => a.group === 'cash')){ if (a.restricted){ restricted += bal[a.id]; restr.push(a); } else { available += bal[a.id]; avail.push(a); } }
    const inv = data.accounts.filter(a => a.group === 'invest'), invested = U.sum(inv, a => a.value);
    const obl = Calc.obligations(data, days), resItems = obl.filter(o => o.reserve), need = U.sum(resItems, o => o.amount);
    const reserved = Math.min(need, Math.max(0, available));
    return { available:U.r2(available), restricted:U.r2(restricted), invested:U.r2(invested), reserved:U.r2(reserved), free:U.r2(available - reserved), shortfall:U.r2(need - reserved), avail, restr, inv, obl, resItems };
  },
  credit(data, bal){
    const cards = data.accounts.filter(a => a.type === 'credit').map(a => {
      const owed = U.r2(-bal[a.id]), pending = U.r2(U.sum(data.tx.filter(t => t.accountId === a.id && t.status === 'pending' && t.kind === 'expense'), t => t.amount));
      return { a, owed, pending, avail:U.r2(a.limit - owed), util:owed / a.limit };
    });
    const owed = U.sum(cards, c => c.owed), limit = U.sum(cards, c => c.a.limit);
    return { cards, owed:U.r2(owed), limit, avail:U.r2(limit - owed), util:owed / limit, pending:U.r2(U.sum(cards, c => c.pending)) };
  },
  subscriptions(data){
    const since = U.iso(U.addDays(U.parse(data.today), -40)), m = new Map();
    for (const t of data.tx) if (t.sub === 'subscription' && t.kind === 'expense' && t.status === 'posted' && t.date >= since) m.set(t.desc, t);
    const list = [...m.values()].sort((a,b) => b.amount - a.amount);
    return { list, monthly:U.r2(U.sum(list, t => t.amount)) };
  },
  cashLedger(data){
    const a = data.byId.cash; let b = a.opening; const rows = [];
    const list = data.tx.filter(t => t.status === 'posted' && (t.accountId === 'cash' || t.counterAccountId === 'cash')).sort((x,y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (x.recordedAt < y.recordedAt ? -1 : 1));
    for (const t of list){ const e = Ledger.effect(t, 'cash'); b = U.r2(b + e); rows.push({ t, e, bal:b }); }
    return rows.reverse();
  },
  reviews(data){ return data.tx.filter(t => t.match); },
  loan(data, bal){
    const a = data.byId.loan, balance = U.r2(-bal.loan), paid = U.r2(a.original - balance);
    let b = balance, months = 0; const r = a.apr/100/12; while (b > 0.005 && months < 120){ b = b*(1+r) - a.payment; months++; }
    const t = U.parse(data.today), payoff = new Date(t.getFullYear(), t.getMonth()+months, 22);
    const interest = U.r2(U.sum(data.tx.filter(x => x.desc === 'AUTO LOAN — INTEREST PORTION'), x => x.amount));
    return { a, balance, paid, pct:paid / a.original, months, payoff:U.iso(payoff), interest };
  },
  resale(data){
    return data.resale.map(s => {
      const pay = data.tx.find(t => t.id === s.payoutId);
      const net = U.r2(s.gross - s.fees - s.ship);
      return Object.assign({}, s, { status:pay ? pay.status : 'posted', payout:U.r2(s.gross - s.fees), net, pl:U.r2(net - s.cost) });
    }).reverse();
  },
  project(data, pid, rg, includePending){
    const m = Calc.metrics(data, rg, { includePending, project:pid });
    const txs = data.tx.filter(t => t.projects.includes(pid) && t.date >= rg.start && t.date <= rg.end).slice().reverse();
    const shared = txs.filter(t => t.projects.length > 1), withOthers = {};
    for (const t of shared) for (const p of t.projects) if (p !== pid) withOthers[p] = (withOthers[p]||0) + 1;
    return { m, txs, shared, withOthers };
  },
  insights(data, C){
    const out = [], t = U.parse(data.today), dim = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(), dom = t.getDate();
    const fixed = new Set(['Housing','Insurance','Utilities','Loan interest','Phone']);
    const disc = rg => U.sum(data.tx.filter(x => x.status === 'posted' && x.date >= rg.start && x.date <= rg.end && (x.kind === 'expense' || x.kind === 'refund') && !fixed.has(x.category) && x.category !== 'AI hardware'), x => x.kind === 'refund' ? -x.amount : x.amount);
    const cur = disc(Calc.range({ period:'month', monthOffset:0 }, data));
    const prev = []; for (let k=1; k<=6; k++){ const rg = Calc.range({ period:'month', monthOffset:-k }, data); if (rg.start >= data.trackingStart) prev.push(disc(rg)); }
    const avg = U.sum(prev) / Math.max(1, prev.length), pace = cur / dom * dim;
    out.push({ c: pace > avg*1.08 ? 'tangerine' : 'sky', t:'DISCRETIONARY SPEND PACE', x:`${F0(cur)} so far this month, on pace for about ${F0(pace)}. Your 6-month average is ${F0(avg)}. Excludes rent, insurance, utilities, phone, loan interest and one-off hardware.` });
    const soon = C.alloc.obl.filter(o => o.days <= 10);
    if (soon.length) out.push({ c:'peach', t:'NEXT 10 DAYS', x:`${soon.length} obligations totaling ${F0(U.sum(soon, o => o.amount))}. Largest: ${soon.slice().sort((a,b) => b.amount - a.amount)[0].name}, ${F0(soon.slice().sort((a,b) => b.amount - a.amount)[0].amount)}.` });
    out.push({ c: C.credit.util < .1 ? 'sky' : C.credit.util < .3 ? 'gold' : 'rose', t:'CREDIT UTILIZATION', x:`${(C.credit.util*100).toFixed(1)}% across both cards. ${C.credit.util < .1 ? 'Under 10%, the range scoring models treat most favorably.' : C.credit.util < .3 ? 'Under 30%. Paying before statements close would lower the reported figure.' : 'Above 30%. Reported utilization at this level can weigh on scores.'}` });
    const open = data.tx.filter(x => x.kind === 'review' && !x.reviewed);
    if (open.length) out.push({ c:'alert', t:'CASH MATCHES WAITING', x:`${open.length} bank ${open.length === 1 ? 'item looks' : 'items look'} like cash movement. Until you confirm, Cash on Hand may be off by up to ${F0(U.sum(open, x => x.amount))}.` });
    return out;
  },
  ideaFit(data, idea, C){
    if (idea.fit) return idea.fit;
    if (idea.fitRule === 'newMoney'){
      const interest = idea.newMoney * 0.04 * idea.holdDays / 365, net = idea.value - interest;
      if (C.alloc.free < idea.newMoney) return { level:'POOR', why:[`Needs ${F0(idea.newMoney)} of new money for ${idea.holdDays} days. Your Free to Spend is ${F0(C.alloc.free)}.`, `Moving that much would leave no cushion above your reserve.`, `Even if funded, your HYSA would have paid about ${F0(interest)} on the same money, so the real gain is ${F0(net)}.`] };
      return { level:'PARTIAL', why:[`Possible: Free to Spend is ${F0(C.alloc.free)}.`, `Your HYSA would earn about ${F0(interest)} on the same money, so the real gain is ${F0(net)}.`] };
    }
    if (idea.fitRule === 'cardSpend'){
      const months = []; for (let k=1; k<=6; k++){ const rg = Calc.range({ period:'month', monthOffset:-k }, data); months.push(U.sum(data.tx.filter(t => t.status === 'posted' && t.kind === 'expense' && (t.accountId === 'corvus' || t.accountId === 'meridian') && t.date >= rg.start && t.date <= rg.end && t.category !== 'AI hardware'), t => t.amount)); }
      const avg = U.sum(months)/months.length, three = avg*3;
      return { level: three >= idea.spendTarget ? 'GOOD' : 'PARTIAL', why:[`Your normal card spending averages ${F0(avg)}/month, about ${F0(three)} over 90 days.`, three >= idea.spendTarget ? 'Moving existing charges to the new card meets the requirement without extra purchases.' : 'You would need to shift more spending than usual. Do not buy things only to qualify.', 'Hard inquiry and a $95 annual fee.'] };
    }
    return { level:'UNKNOWN', why:['Not evaluated yet.'] };
  },
};
function F0(n){ return (n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US'); }

/* Numbers resolve like a computer readout when they change */
function scrambleChanged(force){
  document.querySelectorAll('#console [data-key]').forEach(el => {
    const k = el.dataset.key, v = el.dataset.v;
    if (force || (prevVals[k] !== undefined && prevVals[k] !== v)) scramble(el);

function scramble(el){
  if (S.ui.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const nodes = []; const walk = n => { for (const c of n.childNodes){ if (c.nodeType === 3) nodes.push([c, c.nodeValue]); else walk(c); } }; walk(el);
  const total = U.sum(nodes, n => n[1].length), t0 = performance.now(), dur = 520;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur); let idx = 0;
    for (const [node, fin] of nodes){ let s = ''; for (const ch of fin){ s += (/\d/.test(ch) && idx/total > p) ? String((Math.random()*10)|0) : ch; idx++; } node.nodeValue = s; }
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

let uid = 0;
function niceTop(v){ const raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), m = raw / p, st = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; return st * 4; }
function trendHTML(series, C){

const inSel = (s, C) => s && s.rg.start >= C.rg.start && s.rg.start <= C.rg.end;

function barsSVG(series, C){
  const id = ++uid, W = 960, H = 250, L = 54, R = 8, T = 16, B = 36, n = series.length, hid = S.ui.hidden;
  const keys = ['spend','earn','save'].filter(k => !hid[k]);
  let max = 0; series.forEach(s => s && keys.forEach(k => { max = Math.max(max, s[k]); }));
  const top = niceTop(max || 100), y = v => T + (H-T-B) * (1 - v/top), gw = (W-L-R)/n, bw = Math.min(18, (gw-16)/Math.max(1, keys.length));
  let g = '', bars = '', pend = '', hits = '';
  for (let i=0; i<=4; i++){ const v = top*i/4, yy = y(v); g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--rule);stroke-width:${i ? 1 : 2}"/><text x="${L-8}" y="${yy+4}" text-anchor="end" class="ax">${F.k(v)}</text>`; }
  series.forEach((s, i) => {
    const x0 = L + gw*i, cx = x0 + gw/2;
    if (!s){ g += `<text x="${cx}" y="${H-14}" text-anchor="middle" class="ax" style="opacity:.5">—</text>`; return; }
    const on = inSel(s, C);
    if (on) g += `<rect x="${x0+3}" y="${T-8}" width="${gw-6}" height="${H-T-B+8}" style="fill:var(--gold);opacity:.08"/>`;
    const bx0 = cx - (bw*keys.length + 3*(keys.length-1))/2;
    keys.forEach((k, j) => {
      const bx = bx0 + j*(bw+3), pv = s.pendIncluded ? (s.pend[k] || 0) : 0, real = Math.max(0, s[k] - pv);
      bars += `<rect x="${bx}" y="${y(real)}" width="${bw}" height="${y(0)-y(real)}" style="fill:var(--${k})"/>`;
      if (pv > 0) pend += `<rect x="${bx+.75}" y="${y(s[k])+.75}" width="${bw-1.5}" height="${Math.max(0, y(real)-y(s[k])-1.5)}" style="fill:url(#hp-${k}-${id});stroke:var(--${k});stroke-width:1.5;stroke-dasharray:3 2"/>`;
    });
    const lbl = s.mon === 'JAN' ? `JAN ’${s.yr}` : s.mon;
    g += on ? `<rect x="${cx-26}" y="${H-28}" width="52" height="20" rx="10" style="fill:var(--gold)"/><text x="${cx}" y="${H-13}" text-anchor="middle" style="fill:#000;font-size:12.5px">${lbl}</text>` : `<text x="${cx}" y="${H-13}" text-anchor="middle" class="ax">${lbl}</text>`;
    hits += `<rect x="${x0}" y="0" width="${gw}" height="${H}" style="fill:transparent;cursor:pointer" data-act="pickMonth" data-id="${s.off}" data-hover="${i}"><title>${s.mon} ${s.yr}: Spend ${F.usd(s.spend)}, Earn ${F.usd(s.earn)}, Save ${F.usd(s.save)}</title></rect>`;
  });
  const hp = ['spend','earn','save'].map(k => `<pattern id="hp-${k}-${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="6" style="fill:var(--${k})"/></pattern>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly Spend, Earn and Save for 12 months"><defs><pattern id="sp${id}" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="4" fill="#fff"/></pattern><mask id="sm${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="url(#sp${id})"/></mask>${hp}</defs>${g}<g mask="url(#sm${id})">${bars}</g>${pend}${hits}</svg>`;
}
function netSVG(series, C){
  const W = 960, H = 112, L = 54, R = 8, T = 14, B = 14, n = series.length, gw = (W-L-R)/n;
  const vals = series.map(s => s ? s.net : null).filter(v => v != null);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const span = niceTop(Math.max(hi - lo, 100)); if (hi - lo < span){ const pad = (span - (hi - lo)); hi += pad * (hi/(hi-lo || 1)); lo = hi - span; }
  const y = v => T + (H-T-B) * (hi - v) / (hi - lo);
  let g = `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4"/><text x="${L-8}" y="${y(0)+4}" text-anchor="end" class="ax">$0</text><text x="${L-8}" y="${T+8}" text-anchor="end" class="ax" style="fill:var(--gold)">NET</text>`;
  let path = '';
  series.forEach((s, i) => {
    if (!s) return; const x0 = L + gw*i, x1 = x0 + gw, yy = y(s.net), c = s.net < 0 ? 'neg' : 'net';

  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly Net">${g}<path d="${path}" style="fill:none;stroke:var(--gold);stroke-width:2.5"/></svg>`;

}

      <div style="--c:var(--lavender)"><b>SKIN</b><span>Tokens, fonts, motion, frame renderer. LCARS today.</span></div>
      <div style="--c:var(--lilac)"><b>VIEWS</b><span>Overview, Accounts, Projects, Ideas, Settings.</span></div>
      <div style="--c:var(--violet)"><b>HERMES</b><span>Read-only summary API plus suggestion queue. Phase 4.</span></div></div></section>
  </div>`;
}

/* ── WIDGET ── */
function renderWidget(C){
  const m = C.m, A = C.alloc, next = A.obl[0], n = 20, freeOn = Math.round(A.free / Math.max(1, A.available) * n), resOn = Math.round(A.reserved / Math.max(1, A.available) * n);
  let meter = ''; for (let i=0; i<n; i++) meter += `<i class="${i < freeOn ? 'on' : i < freeOn + resOn ? 'rs' : ''}"></i>`;
  $('#widget').innerHTML = `<div class="w">
    <div class="w-rail"><div class="w-el-t">${stardate()}</div><div class="w-mid"></div><div class="w-mid2">${C.rg.kind === 'month' ? 'MO' : C.rg.kind === 'year' ? 'YR' : 'LT'}</div><div class="w-el-b">01</div></div>
    <div class="w-tb"><span class="w-t">PURSER</span><span class="s" style="--c:var(--gold)"></span><span class="s" style="--c:var(--peach);flex:0 0 26px"></span><span class="s cap" style="--c:var(--lavender)"></span></div>
    <div class="w-fill"></div>
    <div class="w-body">
      <div class="w-r1"><span class="w-lbl">NET · ${h(C.rg.short)}${m.pendIncluded && (m.pend.earn || m.pend.spend) ? ' · INCL. PENDING' : ''}</span><span class="w-demo">DEMO DATA</span></div>
      <div class="w-net num ${m.net < 0 ? 'neg' : ''}">${F.big(m.net)}</div>
      <div class="w-formula">EARN + SAVE − SPEND</div>
      <div class="w-trio"><div style="--c:var(--spend)"><span>SPEND</span><b>${F0(m.spend)}</b></div><div style="--c:var(--earn)"><span>EARN</span><b>${F0(m.earn)}</b></div><div style="--c:var(--save)"><span>SAVE</span><b>${F0(m.save)}</b></div></div>
      <div class="w-free"><div class="row"><span>FREE TO SPEND</span><b class="num">${F0(A.free)}</b></div><div class="w-meter" aria-hidden="true">${meter}</div></div>
      ${next ? `<div class="w-next">NEXT · ${h(next.name.toUpperCase())} ${F0(next.amount)} · ${F.d(next.due)}</div>` : ''}
    </div>
    <div class="w-bb"><span class="s" style="--c:var(--lilac)"></span><span class="s" style="--c:var(--violet);flex:0 0 30px"></span><span class="w-exp">EXPAND ▸</span></div>
  </div>`;
}

/* ── SHELL: the compact ⇄ console transition ── */
const reduced = () => S.ui.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches;
const Shell = {
  busy:false,
  insetFor(r){ return `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round 28px)`; },
  ghost(from, to, dur, delay){
    const g = $('#ghost'); g.hidden = false;
    const k = r => ({ left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px' });
    const a = g.animate([Object.assign(k(from), { opacity:1, borderRadius:'28px' }), Object.assign(k(to), { opacity:.9, borderRadius:to.width > 600 ? '0px' : '28px', offset:.85 }), Object.assign(k(to), { opacity:0, borderRadius:to.width > 600 ? '0px' : '28px' })], { duration:dur, delay, easing:'cubic-bezier(.76,0,.24,1)', fill:'both' });
    a.finished.then(() => { g.hidden = true; a.cancel(); }).catch(() => {});
  },
  async expand(){
    if (S.ui.expanded || this.busy) return; this.busy = true;
    const w = $('#widget'), c = $('#console'), r = w.getBoundingClientRect();
    S.ui.expanded = true; savePrefs(); lastView = null; beep(880, .05); setTimeout(() => beep(1320, .07), 90);
    render();
    c.hidden = false;
    if (reduced()){ w.classList.add('gone'); this.busy = false; prevVals = {}; scrambleChanged(false); $('#main').focus({ preventScroll:true }); return; }
    c.classList.add('boot'); w.classList.add('launch');
    const full = { left:0, top:0, width:innerWidth, height:innerHeight };
    this.ghost(r, full, 900, 60);
    const a = c.animate([{ clipPath:this.insetFor(r) }, { clipPath:'inset(0px 0px 0px 0px round 0px)' }], { duration:SKINS.lcars.motion.expandMs, delay:120, easing:'cubic-bezier(.76,0,.24,1)', fill:'backwards' });
    setTimeout(() => scrambleChanged(true), 820);
    try { await a.finished; } catch(e){}
    w.classList.add('gone'); w.classList.remove('launch');
    setTimeout(() => { c.classList.remove('boot'); }, 1500);
    this.busy = false; const mm = $('#main'); if (mm) mm.focus({ preventScroll:true });
  },
  async collapse(){
    if (!S.ui.expanded || this.busy) return; this.busy = true;
    const w = $('#widget'), c = $('#console');
    S.ui.expanded = false; savePrefs(); beep(1320, .05); setTimeout(() => beep(880, .07), 90);
    renderWidget(CTX || compute()); w.classList.remove('gone');
    const r = w.getBoundingClientRect();
    if (reduced()){ c.hidden = true; c.innerHTML = ''; this.busy = false; w.focus(); return; }
    w.style.opacity = '0'; c.classList.remove('boot'); c.classList.add('shutdown');
    this.ghost({ left:0, top:0, width:innerWidth, height:innerHeight }, r, 700, 140);
    const a = c.animate([{ clipPath:'inset(0px 0px 0px 0px round 0px)' }, { clipPath:this.insetFor(r) }], { duration:SKINS.lcars.motion.collapseMs, delay:140, easing:'cubic-bezier(.7,0,.3,1)', fill:'forwards' });
    try { await a.finished; } catch(e){}
    c.hidden = true; c.classList.remove('shutdown'); a.cancel(); c.innerHTML = '';
    w.style.opacity = ''; w.classList.add('arrive'); w.animate([{ opacity:0, transform:'scale(.96)' }, { opacity:1, transform:'none' }], { duration:300, easing:'ease-out' });
    setTimeout(() => w.classList.remove('arrive'), 800);
    this.busy = false; w.focus({ preventScroll:true });
  },
};

/* ── Audio, toast, stars, clock ── */
let actx = null;
function beep(f, d){ if (!S.ui.audio) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.type = 'sine'; o.frequency.value = f || 1350; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + (d || .05)); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + (d || .05) + .02); } catch(e){} }
let toastT = null;
function toast(msg, c){ const t = $('#toast'); t.style.setProperty('--c', 'var(--' + (c || 'gold') + ')'); t.querySelector('.tt').textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4200); }
function drawStars(){
  const cv = $('#stars'), dpr = Math.min(2, devicePixelRatio || 1), w = innerWidth, ht = innerHeight; cv.width = w*dpr; cv.height = ht*dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr); const rnd = U.rng(47); x.clearRect(0, 0, w, ht);
  for (let i=0; i<Math.round(w*ht/2600); i++){ const s = rnd(); x.globalAlpha = .25 + rnd()*.6; x.fillStyle = s > .93 ? '#ffd9a8' : s > .86 ? '#c9d6ff' : '#ffffff'; const rr = s > .97 ? 1.4 : s > .8 ? .9 : .55; x.beginPath(); x.arc(rnd()*w, rnd()*ht, rr, 0, 6.283); x.fill(); }
  x.globalAlpha = 1;
}
function tickClock(){ const t = new Date(); $('#mb-clock').textContent = t.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + '  ' + t.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }); }

/* ── Widget placement + drag ── */
function placeWidget(x, y){
  const w = $('#widget'), ww = w.offsetWidth, wh = w.offsetHeight;
  x = Math.max(8, Math.min(innerWidth - ww - 8, x)); y = Math.max(36, Math.min(innerHeight - wh - 8, y));
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.style.right = 'auto'; S.ui.wpos = { x, y };
}
function initWidget(){
  const w = $('#widget');
  if (S.ui.wpos) placeWidget(S.ui.wpos.x, S.ui.wpos.y);
  else if (innerWidth < 560) placeWidget((innerWidth - w.offsetWidth)/2, 48);
  let drag = null;
  w.addEventListener('pointerdown', e => { if (e.button !== 0 || Shell.busy) return; const r = w.getBoundingClientRect(); drag = { x:e.clientX, y:e.clientY, ox:r.left, oy:r.top, moved:false }; try { w.setPointerCapture(e.pointerId); } catch(_){} });
  w.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!drag.moved && Math.hypot(dx, dy) < 6) return; drag.moved = true; w.classList.add('dragging'); placeWidget(drag.ox + dx, drag.oy + dy); });
  const end = () => { if (!drag) return; const moved = drag.moved; drag = null; w.classList.remove('dragging'); if (moved) savePrefs(); else Shell.expand(); };
  w.addEventListener('pointerup', end);
  w.addEventListener('pointercancel', () => { drag = null; w.classList.remove('dragging'); });
  w.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); Shell.expand(); } });
}

/* ── Events ── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled || !A[el.dataset.act]) return;
  if (el.dataset.act !== 'collapse') beep(1350, .04);
  if (el.dataset.act !== 'reset' && S.ui.armReset) S.ui.armReset = false;
  const res = A[el.dataset.act](el, e);
  if (res !== false){ savePrefs(); render(); }
});
document.addEventListener('pointerover', e => {
  const el = e.target.closest && e.target.closest('[data-hover]'); if (!el || !CTX || !CTX.series) return;
  const ro = $('#readout'); if (ro) ro.innerHTML = readoutHTML(CTX.series[+el.dataset.hover]);
});
const IN = {
  cashAmt(el){ let v = el.value.replace(/[^0-9.]/g, ''); const p = v.split('.'); if (p.length > 2) v = p[0] + '.' + p.slice(1).join(''); if (p[1] && p[1].length > 2) v = p[0] + '.' + p[1].slice(0, 2); S.ui.cashAmt = v; const pv = $('#cash-preview'); if (pv) pv.innerHTML = cashPreview(); },
  cashNote(el){ S.ui.cashNote = el.value; },
  reconAmt(el){ (S.ui.recon[el.dataset.id] = S.ui.recon[el.dataset.id] || {}).amt = el.value.replace(/[^0-9.]/g, ''); },
  reconAcct(el){ (S.ui.recon[el.dataset.id] = S.ui.recon[el.dataset.id] || {}).acct = el.value; },
};
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target); });
document.addEventListener('focusout', e => { if (e.target.id === 'cash-amt' && S.ui.cashAmt) e.target.value = '$' + S.ui.cashAmt; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ui.expanded){ e.preventDefault(); Shell.collapse(); return; }
  if (!S.ui.expanded || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const i = +e.key; if (i >= 1 && i <= VIEWS.length){ S.ui.view = VIEWS[i-1].id; savePrefs(); render(); }
});
let rzT = null;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { drawStars(); if (S.ui.wpos) placeWidget(S.ui.wpos.x, S.ui.wpos.y); }, 120); });

/* ── Boot ── */
applySkin('lcars');
document.documentElement.classList.toggle('reduce', !!S.ui.reduceMotion);
drawStars(); tickClock(); setInterval(tickClock, 15000);
const startExpanded = S.ui.expanded; S.ui.expanded = false;
render(); initWidget();
if (startExpanded){ S.ui.expanded = true; lastView = null; $('#console').hidden = false; render(); $('#widget').classList.add('gone'); }
else if (!savedPrefs) setTimeout(() => { if (!S.ui.expanded) Shell.expand(); }, 1300);
</script>
